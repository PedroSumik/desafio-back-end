version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: ultralims-postgres
    restart: always
    environment:
      POSTGRES_DB: ultralims_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ultralims-api:
    build: .
    container_name: ultralims-api
    restart: always
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ultralims_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_OPEN_IN_VIEW: "false"
      TZ: America/Sao_Paulo
volumes:
  postgres_data:
